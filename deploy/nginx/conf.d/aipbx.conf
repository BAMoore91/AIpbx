###############################################################################
# AIpbx — nginx virtual-host configuration
#
# Volume mounts (from docker-compose.yml):
#   ./deploy/nginx/conf.d  → /etc/nginx/conf.d   (this file)
#   certbot_certs          → /etc/letsencrypt
#   certbot_www            → /var/www/certbot
#
# Before first run, replace every occurrence of "pbx.example.com" below with
# your actual FQDN.  bootstrap.sh does this automatically via:
#   sed -i "s/pbx.example.com/${DOMAIN}/g" deploy/nginx/conf.d/aipbx.conf
###############################################################################

###############################################################################
# Upstream definitions
###############################################################################
upstream api_backend {
    server api:3000;
    keepalive 32;
}

upstream web_frontend {
    server web:80;
    keepalive 16;
}

###############################################################################
# HTTP server — ACME challenge + redirect to HTTPS
###############################################################################
server {
    listen      80;
    listen      [::]:80;
    server_name pbx.example.com;

    # Let's Encrypt ACME webroot challenge
    # certbot_www volume is mounted at /var/www/certbot inside nginx
    location /.well-known/acme-challenge/ {
        root    /var/www/certbot;
        default_type  "text/plain";
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

###############################################################################
# HTTPS server — main application
###############################################################################
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name pbx.example.com;

    # -------------------------------------------------------------------------
    # TLS — certificates managed by certbot (certbot_certs volume)
    # -------------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/pbx.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pbx.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/pbx.example.com/chain.pem;

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"                                  always;
    add_header X-Content-Type-Options     "nosniff"                                     always;
    add_header X-XSS-Protection           "1; mode=block"                               always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"             always;
    add_header Permissions-Policy         "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss://pbx.example.com wss://pbx.example.com:8089 https://pbx.example.com; media-src 'self' blob:; worker-src 'self' blob:;" always;

    # -------------------------------------------------------------------------
    # General proxy settings
    # -------------------------------------------------------------------------
    proxy_set_header  Host               $host;
    proxy_set_header  X-Real-IP          $remote_addr;
    proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header  X-Forwarded-Proto  $scheme;
    proxy_set_header  X-Forwarded-Host   $host;
    proxy_set_header  X-Forwarded-Port   $server_port;
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;
    proxy_connect_timeout 10s;

    # -------------------------------------------------------------------------
    # REST API — /api/ → api:3000
    # The trailing slash on proxy_pass strips the /api prefix.
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://api_backend/;

        # Allow large payloads (recording uploads, KB document ingest)
        client_max_body_size 100m;

        # Pass through Cache-Control so API can set appropriate caching
        proxy_cache_bypass $http_upgrade;
    }

    # -------------------------------------------------------------------------
    # WebSocket — /ws → api:3000
    # Used for real-time call events, presence, and live dashboards.
    # -------------------------------------------------------------------------
    location /ws {
        proxy_pass http://api_backend/ws;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # WebSocket connections can be long-lived
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout    10s;
    }

    # -------------------------------------------------------------------------
    # Static web SPA — / → web:80
    # The web service serves pre-built static assets via its own nginx.
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://web_frontend/;

        # Cache static assets aggressively (the SPA uses content-hashed filenames)
        proxy_cache_bypass $http_cache_control;

        # Let the upstream set its own cache headers
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Cache hashed static assets for a long time
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif|wasm)$ {
        proxy_pass http://web_frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Health check endpoint (used by load balancers / monitoring)
    # -------------------------------------------------------------------------
    location /healthz {
        proxy_pass http://api_backend/healthz;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Error pages
    # -------------------------------------------------------------------------
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

###############################################################################
# WebRTC WSS — PORT 8089 (Asterisk direct, NOT proxied through nginx)
#
# Asterisk handles WebRTC WSS directly on port 8089 (exposed in docker-compose).
# Browsers connect to:  wss://pbx.example.com:8089/ws
#
# WHY NOT PROXIED: WebRTC requires end-to-end DTLS for SRTP key exchange.
# Proxying would terminate DTLS at nginx, breaking the ICE/DTLS handshake.
# The TLS certificate used by Asterisk on port 8089 must match the domain;
# configure Asterisk with the Let's Encrypt certs from the certbot_certs volume.
#
# In /etc/asterisk/http.conf:
#   [general]
#   tlsenable=yes
#   tlsbindaddr=0.0.0.0:8089
#   tlscertfile=/etc/asterisk/keys/fullchain.pem   ; symlinked from LE certs
#   tlsprivkeyfile=/etc/asterisk/keys/privkey.pem
#
# After cert renewal, copy/symlink and reload Asterisk:
#   docker compose exec asterisk asterisk -rx "module reload http"
###############################################################################
