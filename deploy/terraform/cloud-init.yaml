#cloud-config
# ============================================================================
# AIpbx — cloud-init for DigitalOcean Ubuntu 24.04 droplet
# Rendered by Terraform templatefile(); do NOT use directly.
# Template variables (${...}) are filled by Terraform.
# ============================================================================

package_update: true
package_upgrade: true

packages:
  - curl
  - git
  - ca-certificates
  - gnupg
  - lsb-release
  - ufw
  - fail2ban
  - unzip
  - htop
  - jq
  - awscli        # used by backup.sh for Spaces (S3-compatible)

write_files:
  # --------------------------------------------------------------------------
  # Drop the application .env with all secrets injected by Terraform.
  # The file is written to /opt/aipbx/.env with mode 0600 so only root reads it.
  # --------------------------------------------------------------------------
  - path: /opt/aipbx/.env
    permissions: "0600"
    owner: root:root
    content: |
      # Auto-generated by Terraform cloud-init — do NOT edit manually.
      # Re-deploy via: cd /opt/aipbx && terraform taint ... && terraform apply

      NODE_ENV=production
      DOMAIN=${fqdn}
      PUBLIC_IP=${public_ip}
      TZ=UTC

      POSTGRES_HOST=postgres
      POSTGRES_PORT=5432
      POSTGRES_DB=aipbx
      POSTGRES_USER=aipbx
      POSTGRES_PASSWORD=${postgres_password}
      DATABASE_URL=postgresql://aipbx:${postgres_password}@postgres:5432/aipbx

      REDIS_HOST=redis
      REDIS_PORT=6379
      REDIS_PASSWORD=${redis_password}
      REDIS_URL=redis://:${redis_password}@redis:6379

      API_PORT=3000
      JWT_SECRET=${jwt_secret}
      JWT_REFRESH_SECRET=${jwt_refresh_secret}
      BOOTSTRAP_ADMIN_EMAIL=${admin_email}
      BOOTSTRAP_ADMIN_PASSWORD=${admin_password}
      JWT_ACCESS_TTL=900
      JWT_REFRESH_TTL=2592000
      CORS_ORIGINS=https://${fqdn}
      ENCRYPTION_KEY=${encryption_key}

      ARI_URL=http://asterisk:8088
      ARI_USERNAME=ariuser
      ARI_PASSWORD=${ari_password}
      ARI_APP=aipbx
      ASTERISK_HOST=asterisk
      ASTERISK_SIP_PORT=5060
      ASTERISK_TLS_PORT=5061
      ASTERISK_WSS_PORT=8089
      RTP_START=10000
      RTP_END=10200

      AI_ENGINE_PORT=8080
      AUDIOSOCKET_HOST=0.0.0.0
      AUDIOSOCKET_PORT=9092

      ANTHROPIC_API_KEY=${anthropic_api_key}
      LLM_MODEL=claude-opus-4-8
      LLM_EFFORT=low

      STT_PROVIDER=deepgram
      DEEPGRAM_API_KEY=${deepgram_api_key}
      OPENAI_API_KEY=

      TTS_PROVIDER=elevenlabs
      ELEVENLABS_API_KEY=${elevenlabs_api_key}
      ELEVENLABS_VOICE_ID=21m00Tcm4TlvDq8ikWAM
      AZURE_TTS_KEY=
      AZURE_TTS_REGION=

      S3_ENDPOINT=https://${spaces_region}.digitaloceanspaces.com
      S3_REGION=${spaces_region}
      S3_BUCKET=${spaces_bucket}
      S3_ACCESS_KEY=${spaces_access_key}
      S3_SECRET_KEY=${spaces_secret_key}
      S3_FORCE_PATH_STYLE=false

      SMTP_HOST=${smtp_host}
      SMTP_PORT=587
      SMTP_USER=${smtp_user}
      SMTP_PASSWORD=${smtp_password}
      SMTP_FROM=${smtp_from}

      WEB_PORT=80
      VITE_API_URL=https://${fqdn}/api
      VITE_WS_URL=wss://${fqdn}/ws
      VITE_SIP_WSS_URL=wss://${fqdn}:8089/ws

  # --------------------------------------------------------------------------
  # UFW application profile for the PBX
  # --------------------------------------------------------------------------
  - path: /etc/ufw/applications.d/aipbx
    content: |
      [AIpbx-SIP]
      title=AIpbx SIP
      description=SIP signaling and RTP media for AIpbx
      ports=5060/udp|5061/tcp|8089/tcp|10000:10200/udp

  # --------------------------------------------------------------------------
  # Systemd unit: auto-start the stack after reboots
  # --------------------------------------------------------------------------
  - path: /etc/systemd/system/aipbx.service
    content: |
      [Unit]
      Description=AIpbx Docker Compose Stack
      Requires=docker.service
      After=docker.service network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/aipbx
      ExecStart=/usr/bin/docker compose up -d --remove-orphans
      ExecStop=/usr/bin/docker compose down
      TimeoutStartSec=300

      [Install]
      WantedBy=multi-user.target

runcmd:
  # --------------------------------------------------------------------------
  # 1. Install Docker CE (official repo)
  # --------------------------------------------------------------------------
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - |
    echo \
      "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] \
      https://download.docker.com/linux/ubuntu \
      $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
      tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update -qq
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker

  # --------------------------------------------------------------------------
  # 2. Clone the repository
  # --------------------------------------------------------------------------
  - git clone --branch ${repo_branch} ${repo_url} /opt/aipbx
  # Move the pre-written .env into the repo root (cloud-init wrote it above)
  - cp /opt/aipbx/.env /opt/aipbx/.env.bak 2>/dev/null || true
  # .env was written to /opt/aipbx/.env by cloud-init write_files above

  # --------------------------------------------------------------------------
  # 3. Configure UFW firewall
  # --------------------------------------------------------------------------
  - ufw --force reset
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 80/tcp     comment 'HTTP (ACME challenge + redirect)'
  - ufw allow 443/tcp    comment 'HTTPS'
  - ufw allow 5060/udp   comment 'SIP UDP'
  - ufw allow 5061/tcp   comment 'SIP TLS'
  - ufw allow 8089/tcp   comment 'WebRTC WSS'
  - ufw allow 10000:10200/udp comment 'RTP media'
  # SSH: restricted via DigitalOcean Cloud Firewall (this is belt-and-suspenders)
  - ufw allow 22/tcp     comment 'SSH'
  - ufw --force enable

  # --------------------------------------------------------------------------
  # 4. Configure fail2ban (basic SIP + SSH protection)
  # --------------------------------------------------------------------------
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # --------------------------------------------------------------------------
  # 5. Seed a self-signed placeholder cert so nginx :443 starts on first boot
  #    (the LE files don't exist until init-letsencrypt runs → else deadlock).
  # --------------------------------------------------------------------------
  - docker volume create aipbx_certbot_certs || true
  - >
    docker run --rm -v aipbx_certbot_certs:/etc/letsencrypt alpine:3.20 sh -c
    'set -e; D=/etc/letsencrypt/live/${fqdn};
    if [ -f $D/fullchain.pem ]; then exit 0; fi;
    apk add --no-cache openssl >/dev/null; mkdir -p $D;
    openssl req -x509 -newkey rsa:2048 -nodes -days 3 -keyout $D/privkey.pem -out $D/fullchain.pem -subj /CN=${fqdn} >/dev/null 2>&1;
    cp $D/fullchain.pem $D/chain.pem'

  # --------------------------------------------------------------------------
  # 6. Pull images and start the stack
  # --------------------------------------------------------------------------
  - cd /opt/aipbx && docker compose pull --quiet || true
  - cd /opt/aipbx && docker compose up -d --build

  # --------------------------------------------------------------------------
  # 6. Enable the systemd unit for post-reboot auto-start
  # --------------------------------------------------------------------------
  - systemctl enable aipbx.service

  # --------------------------------------------------------------------------
  # 7. Obtain TLS certificate (runs after nginx is up)
  #    The init-letsencrypt.sh script handles staging/production toggle.
  # --------------------------------------------------------------------------
  - sleep 30
  - DOMAIN=${fqdn} EMAIL=${acme_email} bash /opt/aipbx/deploy/scripts/init-letsencrypt.sh

final_message: |
  AIpbx cloud-init complete. Stack is running at https://${fqdn}
  Check logs: cd /opt/aipbx && docker compose logs -f
