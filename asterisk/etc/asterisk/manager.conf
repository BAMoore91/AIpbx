; =============================================================================
; manager.conf — Asterisk Manager Interface (AMI) configuration
;
; AMI provides a TCP socket interface for the api service to:
;   - Originate calls (Action: Originate)
;   - Add/remove queue members (QueueAdd/QueueRemove/QueuePause)
;   - Manage voicemail (VoicemailUsersList, MessageDelete)
;   - Reload config (Action: UpdateConfig, Reload)
;   - Subscribe to real-time events (CDR, call state, queue stats)
;   - Send DTMF (Action: PlayDTMF)
;   - Bridge channels (Action: Bridge)
;   - Transfer calls (Action: Redirect)
;
; Processed by envsubst in entrypoint.sh.
; Variables substituted: ${ARI_PASSWORD}
;
; AMI listens on port 5038 (TCP) inside the Docker network.
; The api service connects to asterisk:5038.
; =============================================================================

[general]
; Enable AMI.
enabled             = yes

; Bind to all interfaces (Docker network restricts external access).
; In production, restrict to 127.0.0.1 or the Docker bridge network if AMI
; is only needed from containers on the same host.
bindaddr            = 0.0.0.0
port                = 5038

; How long an idle AMI session stays open (seconds).
; 0 = never timeout. Use a reasonable value for production.
timeout             = 0

; Challenge/response authentication (MD5).
; The api service uses plain-text over the trusted Docker network.
; Set to yes if AMI is exposed on an untrusted network.
; displayconnects = yes
; timestampevents = yes

; TLS AMI (optional — uncomment and configure if exposing outside Docker).
; tlsenable           = no
; tlsbindaddr         = 0.0.0.0:5039
; tlscertfile         = /etc/asterisk/keys/asterisk.crt
; tlsprivkeyfile      = /etc/asterisk/keys/asterisk.key

; ---------------------------------------------------------------------------
; [aipbx] — AMI user for the api service
; ---------------------------------------------------------------------------
[aipbx]
secret              = ${ARI_PASSWORD}
; Allow connections from any IP on the Docker network.
; In production, restrict to the api container's IP range.
; permit             = 172.16.0.0/12
; permit             = 10.0.0.0/8
; deny               = 0.0.0.0/0
; permit             = 127.0.0.1/255.255.255.0

; Deny world — allow only Docker bridge networks.
; (Set deny/permit to match your Docker network CIDR)
deny                = 0.0.0.0/0.0.0.0
permit              = 127.0.0.1/255.255.255.255
; Docker default bridge and typical Compose bridge ranges.
permit              = 172.16.0.0/255.240.0.0
permit              = 10.0.0.0/255.0.0.0
permit              = 192.168.0.0/255.255.0.0

; Read/write event permissions.
; Format: read = <event categories> | write = <action categories>
; See: https://docs.asterisk.org/Configuration/Interfaces/Asterisk-Manager-Interface-AMI/AMI-Manager-Users/
read                = system,call,log,verbose,agent,user,config,dtmf,reporting,cdr,dialplan,originate,message
write               = system,call,agent,user,config,command,reporting,originate,message

; Permit AMI over HTTP (via the AJAMinterface — Asterisk's AJAX AMI).
; Disabled by default; enable only if you need browser-based AMI access.
; writetimeout = 100

; ---------------------------------------------------------------------------
; [monitor] — Read-only AMI user for external monitoring/dashboards
; (optional, uncomment to enable)
; ---------------------------------------------------------------------------
; [monitor]
; secret              = MONITOR_SECRET
; deny                = 0.0.0.0/0.0.0.0
; permit              = 172.16.0.0/255.240.0.0
; permit              = 10.0.0.0/255.0.0.0
; read                = system,call,log,reporting,cdr
; write               = system
