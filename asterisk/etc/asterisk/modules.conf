; =============================================================================
; modules.conf — Module load/noload directives for AIpbx
;
; Strategy: autoload=yes loads all modules found in the modules directory,
; then we selectively suppress legacy/unused modules with "noload" and
; ensure critical modules are explicitly loaded first.
;
; Minimum required for AIpbx:
;   chan_pjsip        — PJSIP channel driver (SIP, WebRTC)
;   res_pjsip*        — PJSIP subsystem modules
;   res_ari*          — Asterisk REST Interface
;   app_audiosocket   — AudioSocket dialplan application
;   chan_audiosocket   — AudioSocket channel driver
;   res_http_websocket — WebSocket support (for WebRTC WSS and ARI WS)
;   app_queue         — Call queues (ACD)
;   app_confbridge    — ConfBridge conferencing
;   res_musiconhold   — Music on hold
; =============================================================================

[modules]
autoload = yes

; ---------------------------------------------------------------------------
; Suppress legacy / conflicting modules
; ---------------------------------------------------------------------------

; chan_sip is the old SIP stack — must NOT load alongside chan_pjsip
noload => chan_sip.so

; DAHDI is for physical telephony hardware (not needed in a cloud PBX)
noload => chan_dahdi.so
noload => res_timing_dahdi.so

; MGCP / SKINNY / H.323 are legacy protocols not used in AIpbx
noload => chan_mgcp.so
noload => chan_skinny.so
noload => chan_ooh323.so

; OSS/ALSA audio drivers (no sound card in a container)
noload => chan_oss.so
noload => chan_alsa.so

; Phone channel (analog FXS) — not applicable
noload => chan_phone.so

; res_adsi — Analog Display Services Interface (not needed)
noload => res_adsi.so

; ---------------------------------------------------------------------------
; Explicitly pre-load critical modules to guarantee load order.
; (autoload=yes will skip them if already loaded.)
; ---------------------------------------------------------------------------

; ODBC + realtime backend — MUST load before res_pjsip and sorcery modules
; so that the extconfig families and ODBC connection pool are ready when
; PJSIP starts querying for endpoint/auth/aor objects.
;
;   res_odbc.so          — ODBC connection pool (reads res_odbc.conf)
;   res_config_odbc.so   — realtime driver: translates extconfig families
;                          into SQL queries over the ODBC pool
;   res_sorcery_config.so     — sorcery "config" wizard (static file reader)
;   res_sorcery_memory.so     — sorcery in-memory cache wizard
;   res_sorcery_realtime.so   — sorcery "realtime" wizard (delegates to
;                               res_config_odbc / extconfig)
;
; Load order: res_odbc → res_config_odbc → sorcery wizards → res_pjsip
preload => res_odbc.so
preload => res_config_odbc.so
preload => res_sorcery_config.so
preload => res_sorcery_memory.so
preload => res_sorcery_realtime.so

; Core PJSIP stack — order matters
load => res_pjproject.so
load => res_pjsip.so
load => res_pjsip_session.so
load => res_pjsip_authenticator_digest.so
load => res_pjsip_endpoint_identifier_anonymous.so
load => res_pjsip_endpoint_identifier_ip.so
load => res_pjsip_endpoint_identifier_user.so
load => res_pjsip_mwi.so
load => res_pjsip_notify.so
load => res_pjsip_one_touch_record_info.so
load => res_pjsip_outbound_registration.so
load => res_pjsip_path.so
load => res_pjsip_pidf_body_generator.so
load => res_pjsip_publish_asterisk.so
load => res_pjsip_pubsub.so
load => res_pjsip_refer.so
load => res_pjsip_registrar.so
