; =============================================================================
; features.conf — In-call DTMF feature codes (call transfer, parking, etc.)
;
; These features are activated by pressing DTMF during an active call.
; The Dial() options flags (t/T/k/K/H) in extensions.conf control which
; party can activate which features.
;
;   Dial(PJSIP/${EXTEN},${RING_TIMEOUT},tT)
;     t — allow callee to blind-transfer
;     T — allow caller to blind-transfer
;     k — allow callee to park
;     K — allow caller to park
;     H — allow caller to hang up using DTMF
; =============================================================================

[general]
; DTMF feature activation timeout (ms).  User must press feature code within
; this time after the first DTMF digit.
featuredigittimeout = 1000

; Milliseconds of RTP silence before considering the DTMF sequence complete.
transferdigittimeout = 3000

; How long to attempt an attended transfer before timing out.
atxfernoanswertimeout = 15

; Abort attended transfer on hangup (drop call rather than complete blind).
atxferdropcall      = no

; Retry attended transfer after the callee hangs up without transferring.
atxferloopdelay     = 10
atxfercallbackretries = 2

; ---------------------------------------------------------------------------
; [featuremap] — Single-key in-call DTMF features
; ---------------------------------------------------------------------------
[featuremap]
; Blind transfer — put caller on hold, dial a new number, transfer immediately.
blindxfer           = #1
; Attended transfer — put caller on hold, dial, wait for answer, then transfer.
atxfer              = *2
; Disconnect call (useful for supervised listening).
disconnect          = *0
; One-touch recording toggle.
automon             = *3
; One-touch HOLD toggle (sends re-INVITE with hold SDP).
; no_one_touch_monitor = yes

; ---------------------------------------------------------------------------
; [applicationmap] — Multi-key DTMF feature codes (context-based)
;
; Format: <feature-name> => <activate-on>,<DTMF-code>,<dialplan-app>[,<args>]
;   activate-on: caller | callee | both
; ---------------------------------------------------------------------------
[applicationmap]
; Example: *5 parks the call.
; parkandannounce => caller,*5,Park()

; ---------------------------------------------------------------------------
; [parkedcalls] — Call park configuration
; ---------------------------------------------------------------------------
[parkedcalls]
; Extension to dial to park a call.
parkext             = 700
; Range of parking slots.
parkpos             = 701-720
; Context where parked calls live.
context             = parkedcalls
; Seconds before a parked call times out and is returned to the parker.
parkingtime         = 300
; Where to send the caller after parkingtime expires (blank = hang up).
; comebacktoorigin    = yes
; comebackcontext     = aipbx-internal
; comebackdialtime    = 30

; Announce parking position to the parker?
parkedplay          = caller
; Say the parking position to the parker.
; parkannounce        = vm-parked-calls-

; Park callers in MOH.
findslot            = first
