; =============================================================================
; rtp.conf — RTP (Real-Time Protocol) media port and ICE/STUN configuration
;
; Processed by envsubst in entrypoint.sh.
; Variables substituted: ${RTP_START}, ${RTP_END}, ${PUBLIC_IP}
;
; Port range must match the ports exposed in docker-compose.yml:
;   "10000-10200:10000-10200/udp"
; =============================================================================

[general]
; ---------------------------------------------------------------------------
; RTP port range
; ---------------------------------------------------------------------------
; Asterisk allocates one even-numbered port per media stream from this range.
; 200-port range supports ~100 simultaneous media streams (each call uses 2
; ports: RTP + RTCP).  Increase RTP_END for higher call concurrency.
rtpstart        = ${RTP_START}
rtpend          = ${RTP_END}

; ---------------------------------------------------------------------------
; Security
; ---------------------------------------------------------------------------
; strictrtp: drop RTP packets that arrive from an unexpected source address.
; Helps prevent RTP injection attacks.  Set to "yes" in production.
; Set to "no" during initial testing if media cuts out unexpectedly (some NATs
; change the source address mid-call).
strictrtp       = yes

; icesupport: enable ICE (Interactive Connectivity Establishment) for WebRTC.
; Required for browser-based WebRTC softphones.
icesupport      = yes

; ---------------------------------------------------------------------------
; STUN / TURN for ICE
;
; ICE allows WebRTC peers to discover paths through NAT.  For cloud deployments
; on DigitalOcean the server has a public IP routable directly, so STUN is
; enough for most clients.  For clients behind symmetric NAT you may need TURN.
;
; stunaddr: STUN server used by Asterisk to discover its own public address
;           for ICE candidates.  Using Google's public STUN server here;
;           replace with your own or a coturn instance for production.
;
; turnaddr / turnusername / turnpassword: TURN relay server (optional).
; ---------------------------------------------------------------------------
stunaddr        = stun.l.google.com:19302

; turnaddr        = turn.aipbx.example.com:3478
; turnusername    = aipbx
; turnpassword    = TURN_SECRET

; ---------------------------------------------------------------------------
; DTLS-SRTP (for WebRTC encrypted media)
;
; dtlsenable: enable DTLS negotiation in Asterisk's RTP engine.
; This is required for WebRTC endpoints (configured per-endpoint in pjsip.conf
; via webrtc=yes, but the global flag must also be set).
; ---------------------------------------------------------------------------
dtlsenable      = yes

; ---------------------------------------------------------------------------
; Timing / QoS
; ---------------------------------------------------------------------------
; rtpchecksums: verify UDP checksums on RTP packets.
rtpchecksums    = yes

; QoS DSCP marking for RTP packets.
; EF (Expedited Forwarding) = 0xb8 = DSCP 46 — telephony standard.
tos_audio       = ef
cos_audio       = 5

; How long (ms) of silence before Asterisk considers the RTP stream dead.
; Default 10000 ms; increase if calls drop in low-traffic periods.
rtptimeout      = 60
rtpholdtimeout  = 300
rtpkeepalive    = 0
