; =============================================================================
; http.conf — Asterisk built-in HTTP/WebSocket server configuration
;
; This server handles:
;   1. ARI REST API  (http://asterisk:8088/ari/...)
;   2. ARI WebSocket events (ws://asterisk:8088/ari/events)
;   3. WebRTC WSS transport (wss://asterisk:8089/ws)
;      (Asterisk listens for SIP-over-WebSocket connections from JsSIP/SIP.js)
;
; Processed by envsubst — no ${VAR} placeholders needed here (ports are fixed).
; =============================================================================

[general]
; Enable the HTTP server.
enabled             = yes

; Bind to all interfaces inside the container.
; The Docker network restricts external access; nginx/firewall provides
; additional filtering in production.
bindaddr            = 0.0.0.0

; Plain HTTP port — used by ARI and for health-check probes.
; The api service connects to http://asterisk:8088
bindport            = 8088

; TLS/HTTPS port — also used for WebRTC WSS on the same port (8089).
; Asterisk uses the same HTTP server for both HTTPS and WSS.
tlsenable           = yes
tlsbindaddr         = 0.0.0.0:8089

; DTLS/WSS certificate — generated by entrypoint.sh if not present.
; In production, replace with a real Let's Encrypt cert.
tlscertfile         = /etc/asterisk/keys/asterisk.crt
tlsprivkeyfile      = /etc/asterisk/keys/asterisk.key

; Allow only TLS 1.2+ (disable SSLv3 / TLSv1.0 / TLSv1.1).
tlscipher           = AES256-SHA:AES128-SHA
tlsclientmethod     = tlsv1_2

; HTTP session settings.
; sessionlimit: max concurrent HTTP sessions (ARI + WebRTC phones).
sessionlimit        = 100

; How long an idle HTTP session lives (seconds).
session_inactivity  = 30000

; Enable Cross-Origin Resource Sharing for the ARI endpoint.
; The api service calls ARI from the same Docker network, but the web console
; may call it directly from a browser during development.
; In production, proxy ARI through nginx instead of exposing it directly.
; (allowed_origins is also configured in ari.conf)

; Redirect / → /ari/api-docs for convenience.
redirect = /ari/api-docs

; Prefix for static content served by Asterisk (sounds, etc.)
prefix =

; ---------------------------------------------------------------------------
; URI paths registered automatically by Asterisk modules:
;
;   GET  /ari/...              — ARI REST endpoints (res_ari_*)
;   WS   /ari/events           — ARI WebSocket event stream
;   WS   /ws                   — PJSIP WebSocket/WebRTC connections
;                                (res_pjsip_transport_websocket.so)
;   GET  /httpstatus           — HTTP server status page
;   GET  /ari/api-docs         — Swagger/OpenAPI docs for ARI
; ---------------------------------------------------------------------------
