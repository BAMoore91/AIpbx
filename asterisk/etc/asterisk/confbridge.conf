; =============================================================================
; confbridge.conf — ConfBridge conferencing configuration for AIpbx
;
; ConfBridge replaces the legacy MeetMe/app_meetme (which required DAHDI).
; It is pure-software and supports HD audio, SIP INFO DTMF, recording, etc.
;
; The api service can create/join/leave conferences via:
;   ARI  — Bridge API (type=mixing) — the preferred approach for dynamic
;           AI-managed conferences
;   AMI  — ConfbridgeKick, ConfbridgeMute, ConfbridgeList actions
;   Dialplan — ConfBridge(<conf-number>[,bridge_profile[,user_profile]])
;
; This file defines profiles that the dialplan/api service references by name.
; =============================================================================

; =============================================================================
; [general] — Global ConfBridge settings
; =============================================================================
[general]

; =============================================================================
; BRIDGE PROFILES — define how a conference room behaves
; =============================================================================

; ---------------------------------------------------------------------------
; [default_bridge] — Standard conference bridge
; ---------------------------------------------------------------------------
[default_bridge]
type                = bridge
; Maximum number of participants (0 = unlimited).
max_members         = 50
; Record the entire conference to /var/spool/asterisk/monitor/
; record_conference  = yes
; record_file        = /var/spool/asterisk/monitor/conf-${UNIQUEID}.wav
; Play a sound when someone joins.
join_sound          = conf-hasentered
; Play a sound when someone leaves.
leave_sound         = conf-hasexited
; Language for system prompts.
language            = en
; Enable talk detection (emits AMI/ARI events on speech activity).
; Useful for the AI engine to detect barge-in.
talker_detection_events = yes
; Video mode: none | follow_talker | last_marked | first_marked | sfu
video_mode          = none
; Enable remb (Receiver Estimated Max Bitrate) for video SFU mode.
enable_events       = yes

; ---------------------------------------------------------------------------
; [large_bridge] — High-capacity webinar-style bridge (many listeners)
; ---------------------------------------------------------------------------
[large_bridge]
type                = bridge
max_members         = 500
join_sound          = beep
leave_sound         = beep
language            = en
talker_detection_events = yes
video_mode          = none

; =============================================================================
; USER PROFILES — define per-participant behaviour
; =============================================================================

; ---------------------------------------------------------------------------
; [default_user] — Standard participant
; ---------------------------------------------------------------------------
[default_user]
type                = user
; Play "you are currently the only participant" if joining empty room.
; announce_only_user = yes
; Play participant count on join.
announcement        = conf-onlyperson
; Mute on join (moderator must unmute). Comment out for open discussion.
; startmuted         = yes
; Allow user to mute/unmute themselves with *1 DTMF.
; dtmf_passthrough   = no
; PIN code (empty = no PIN).
; pin                =
; Play a sound before removing user when kicked by moderator.
; Increase to give the user a moment to react.
;
; Hearing participants: admin, normal user
hearing_user        = yes
; Talking: admin, normal
talking_user        = yes
; Admin privileges (kick others, lock room) if user enters admin PIN.
; admin               = no
music_on_hold_when_empty = yes
music_on_hold_class = default
; Announce the user's name when joining (requires recording their name on entry).
; announce_user_count = yes
; announce_join_leave = yes

; ---------------------------------------------------------------------------
; [admin_user] — Conference moderator/admin
; ---------------------------------------------------------------------------
[admin_user]
type                = user
admin               = yes
marked              = yes
; Admin hears a different join sound.
announcement        = conf-adminvalidated
hearing_user        = yes
talking_user        = yes
music_on_hold_when_empty = yes
music_on_hold_class = default
; Admin can kick, mute, lock the conference.
; DTMF keys for admin:
;   *1 — mute/unmute self
;   *2 — lock/unlock conference
;   *3 — eject last user
;   *4 — reduce conference to admin only
;   *5 — play participant count

; ---------------------------------------------------------------------------
; [listen_only] — Listen-only participant (e.g. external supervisors)
; ---------------------------------------------------------------------------
[listen_only]
type                = user
startmuted          = yes
admin               = no
hearing_user        = yes
talking_user        = no
music_on_hold_when_empty = yes
