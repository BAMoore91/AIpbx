; =============================================================================
; sorcery.conf — Sorcery object/storage wizard mappings for Asterisk 20
;
; Sorcery is the abstraction layer between PJSIP object types and their
; backing store.  Each line inside a section header maps an object type to
; a storage wizard ("realtime" here) and its configuration resource (the
; family name from extconfig.conf).
;
; Section header format:  [<module>]
; Mapping line format:    <object_type> = <wizard>[,<config_resource>]
;
; For realtime wizards the config_resource is the extconfig family name,
; which res_config_odbc resolves to the correct ODBC DSN + table.
;
; Important Asterisk 20 nuances
; -----------------------------
; 1. Multiple object types can share the SAME section header — Asterisk
;    accumulates all mappings under each module name.  So [res_pjsip] may
;    appear more than once and all its lines are merged.
;
; 2. The "realtime" wizard is provided by res_sorcery_realtime.so.  It
;    delegates all I/O to the extconfig/res_config_odbc stack.
;
; 3. Static pjsip.conf objects (transports, seed endpoints 1001/1002,
;    anonymous) continue to be loaded by the "config" wizard (the default
;    when no sorcery.conf override exists for that object type at the
;    [res_pjsip] level).  Adding realtime mappings does NOT disable static
;    loading — Asterisk queries both and merges the results.  Transports
;    are NOT mapped to realtime here because they are always static.
;
; 4. The identify object type lives in res_pjsip_endpoint_identifier_ip.so
;    and the registration object type in res_pjsip_outbound_registration.so,
;    so they get their own section headers.
; =============================================================================

; ---------------------------------------------------------------------------
; Core PJSIP objects: endpoints, auth credentials, address-of-records
; ---------------------------------------------------------------------------
[res_pjsip]
endpoint    = realtime,ps_endpoints
auth        = realtime,ps_auths
aor         = realtime,ps_aors

; ---------------------------------------------------------------------------
; Contact storage — written by Asterisk when a UA sends REGISTER.
; Mapping this to realtime lets contacts survive Asterisk restarts (the DB
; persists them) and lets multiple Asterisk nodes share a contact table.
; ---------------------------------------------------------------------------
[res_pjsip]
contact     = realtime,ps_contacts

; ---------------------------------------------------------------------------
; IP/domain-based endpoint identification (res_pjsip_endpoint_identifier_ip)
; Maps inbound SIP source addresses to endpoint names without requiring auth.
; Used for trusted carrier trunks and internal network devices.
; ---------------------------------------------------------------------------
[res_pjsip_endpoint_identifier_ip]
identify    = realtime,ps_endpoint_id_ips

; ---------------------------------------------------------------------------
; Outbound trunk registrations (res_pjsip_outbound_registration)
; The control-plane writes rows to ps_registrations; Asterisk picks them up
; and manages the REGISTER dialog to the carrier.
; ---------------------------------------------------------------------------
[res_pjsip_outbound_registration]
registration = realtime,ps_registrations
