; =============================================================================
; logger.conf — Asterisk logging configuration for AIpbx
;
; Asterisk writes logs to:
;   1. Console (stdout) — captured by Docker's logging driver (json-file)
;   2. /var/log/asterisk/full — all messages, rotated by logrotate or manually
;   3. /var/log/asterisk/messages — warnings and above
;   4. /var/log/asterisk/cdr-csv — CDR in CSV format (also see cdr_csv.conf)
;
; Log levels (from least to most verbose):
;   error   — fatal/critical errors only
;   warning — recoverable error conditions
;   notice  — informational events (registration, call start/end)
;   verbose — more informational output (set verbose = 3+ in asterisk.conf)
;   debug   — low-level internal state (set debug = N in asterisk.conf)
;   dtmf    — DTMF events
;   fax     — T.38 fax events
; =============================================================================

[general]
; Rotate the log files when Asterisk receives a SIGHUP.
; Also supports: rotate_strategy = rotate (adds timestamp suffix)
; and: rotate_strategy = sequential (numbered backup files)
rotate_timestamp    = no

; ---------------------------------------------------------------------------
; [logfiles] — Log file destinations
; ---------------------------------------------------------------------------
[logfiles]
; --- Console / stdout ---
; Docker captures stdout.  Output NOTICE, WARNING, ERROR so the compose
; logs are meaningful without being excessively noisy.
; Increase to "verbose,debug" when troubleshooting.
console             => notice,warning,error,verbose

; --- Full log file ---
; Contains everything.  Rotate with logrotate or:
;   docker exec aipbx-asterisk asterisk -rx "logger rotate"
full                => notice,warning,error,verbose,debug,dtmf

; --- Messages log (warnings and above) ---
; Easier to grep for production issues.
messages            => notice,warning,error

; --- Security log (authentication failures, etc.) ---
; security            => security

; --- CDR-CSV log ---
; CDR records are written here by cdr_csv.so.  The api service can also
; consume CDR events via AMI (event: Cdr) for real-time processing.
; cdr-csv is a separate format file; the actual path is set in cdr.conf.
