; =============================================================================
; extconfig.conf — Realtime family → backend mappings
;
; Syntax: <family> => <driver>,<resource>[,<table>]
;
; For ODBC realtime the resource is the DSN name defined in res_odbc.conf
; (the [asterisk] section's connection pool, which uses DSN "asterisk-pg").
; The optional third argument overrides the table name; omitting it means
; Asterisk uses the family name as the table name, which matches the ps_*
; naming convention created by the control-plane migrations.
;
; These families tell Asterisk's res_config_odbc driver where to look when
; the sorcery layer (sorcery.conf) requests a realtime object load/store.
;
; NOTE: extconfig.conf must live in the [settings] section — no other
; section name is recognised by Asterisk's realtime core.
; =============================================================================

[settings]
ps_endpoints        => odbc,asterisk
ps_auths            => odbc,asterisk
ps_aors             => odbc,asterisk
ps_contacts         => odbc,asterisk
ps_endpoint_id_ips  => odbc,asterisk
ps_registrations    => odbc,asterisk
