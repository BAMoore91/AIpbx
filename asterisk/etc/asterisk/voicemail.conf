; =============================================================================
; voicemail.conf — Voicemail configuration for AIpbx
;
; Voicemail storage: /var/spool/asterisk/voicemail/
; This directory is on the asterisk_spool Docker volume so messages persist
; across container restarts.
;
; In production the api service can:
;   1. Trigger transcription (Whisper/Deepgram) of new voicemail WAV files.
;   2. Email notifications via SMTP settings below.
;   3. List/delete mailboxes via AMI VoicemailUsersList / MessageDelete actions.
; =============================================================================

[general]
; Format(s) to save voicemail in.
; "wav49|gsm|wav" saves in three formats (WAV49/GSM most compact, WAV for TTS).
; For AI transcription we need uncompressed WAV — keep "wav" in the list.
format              = wav49|gsm|wav

; How many seconds to record each greeting and message.
maxgreet            = 60
maxmessage          = 300
minmessage          = 3

; Maximum number of messages per folder.
maxmsg              = 100

; Number of seconds of silence before ending a recording.
maxsilence          = 10
silencethreshold    = 128

; Skip voicemail tutorial on first login.
skipms              = 3000

; Maximum login attempts before disconnecting.
maxlogins           = 3

; Say the callerid when playing back messages.
saycid              = yes

; Say the envelope (date/time/callerid) before each message.
envelope            = yes

; Play a brief description of each folder when checking messages.
playfolder          = yes

; Notify MWI immediately via PJSIP NOTIFY.
pollmailboxes       = no
pollfreq            = 30

; ---------------------------------------------------------------------------
; Email notifications
;
; When a voicemail is left, send an email with the WAV attachment.
; The api service also listens for AMI MessageWaiting events and can
; send richer notification emails via its own SMTP module.
; ---------------------------------------------------------------------------
; serveremail         = voicemail@aipbx.example.com
; mailcmd             = /usr/sbin/sendmail -t
; emailsubject        = [AIpbx] New voicemail from ${VM_CALLERID} in mailbox ${VM_MAILBOX}
; emailbody           = Hi ${VM_NAME},\n\nYou have a new voicemail message.\n\nCaller: ${VM_CALLERID}\nDate:   ${VM_DATE}\nLength: ${VM_DUR} seconds\n\nPlease log in to your AIpbx portal to listen.\n
; emaildateformat     = %A, %B %d, %Y at %r
; attach              = yes
; attachfmt           = wav49

; ---------------------------------------------------------------------------
; [zonemessages] — Timezone-aware message timestamps
; ---------------------------------------------------------------------------
[zonemessages]
; Define timezones for message timestamps.
eastern     = America/New_York|'vm-received' q 'digits/at' IMp
central     = America/Chicago|'vm-received' q 'digits/at' IMp
mountain    = America/Denver|'vm-received' q 'digits/at' IMp
pacific     = America/Los_Angeles|'vm-received' q 'digits/at' IMp
utc         = UTC|'vm-received' q 'digits/at' HM
london      = Europe/London|'vm-received' q 'digits/at' HM

; ---------------------------------------------------------------------------
; [default] — Default voicemail context
;
; The api service creates/deletes mailbox entries dynamically via AMI
; (UpdateConfig action or direct DB writes if using Asterisk realtime).
; These seed mailboxes match the seed PJSIP endpoints in pjsip.conf.
;
; Format: <mailbox> => <password>,<name>,<email>,[pager],[options]
; ---------------------------------------------------------------------------
[default]
; Seed mailbox for extension 1001.
; Password: 1234 (change in production — api service manages these).
1001 => 1234,Extension 1001,,timezone=eastern
; Seed mailbox for extension 1002.
1002 => 1234,Extension 1002,,timezone=eastern

; The api service adds mailboxes dynamically.  When a new user is provisioned
; via the admin API, the api service calls AMI UpdateConfig to add an entry:
;   Action: UpdateConfig
;   SrcFilename: voicemail.conf
;   DstFilename: voicemail.conf
;   Action-000000: NewCat
;   Cat-000000: default
;   Action-000001: Append
;   Cat-000001: default
;   Var-000001: 1003
;   Value-000001: 9999,New User,,timezone=eastern
; Then: Action: UpdateConfig reload=yes
