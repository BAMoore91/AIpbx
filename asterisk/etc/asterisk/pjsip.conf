; =============================================================================
; pjsip.conf — PJSIP SIP stack configuration for AIpbx
;
; Processed by envsubst in entrypoint.sh.  All ${VAR} placeholders are
; replaced with live environment values before Asterisk loads this file.
;
; Variables substituted:
;   ${PUBLIC_IP}    — server public IP (for NAT traversal)
;   ${ARI_PASSWORD} — reused as default SIP secret for seed endpoints
;
; Design philosophy
; -----------------
;  1. Four transports:  UDP/5060, TCP/5060, TLS/5061 (SIP-TLS), WSS/8089 (WebRTC).
;  2. Seed endpoints 1001 (UDP softphone) and 1002 (WebRTC browser) demonstrate
;     both classic SIP and WebRTC patterns.
;  3. A commented trunk block shows the pattern for carrier registration.
;  4. The api service adds/modifies endpoints at runtime via ARI+AMI or
;     PJSIP realtime (res_pjsip_config_wizard + ODBC/Postgres).
;     For realtime, set ps_endpoints/ps_auths/ps_aors tables in Postgres and
;     configure res_odbc.conf + sorcery.conf accordingly (not in scope here).
; =============================================================================

; -----------------------------------------------------------------------------
; GLOBAL defaults applied to all endpoints unless overridden.
; -----------------------------------------------------------------------------
[global]
type                    = global
; Max contacts per AOR — be generous for dev, tune down in production.
max_contacts            = 10
; Send REGISTER challenges — needed for endpoints that do not pre-auth.
send_registrations      = yes
; Asterisk's endpoint identifier tries user, IP, anonymous in order.
endpoint_identifier_order = ip,username,anonymous
; Avoid 100rel (PRACK) issues with some carriers.
disable_multi_domain    = no

; -----------------------------------------------------------------------------
; SYSTEM settings (PJSIP project-level tuning)
; -----------------------------------------------------------------------------
[system]
type                    = system
; Timer B: transaction timeout (ms). 32000 ms (default).
timer_b                 = 32000
; Compact SIP headers save bandwidth on mobile links.
compact_headers         = no

; =============================================================================
; TRANSPORTS
; =============================================================================

; -----------------------------------------------------------------------------
; UDP transport — standard SIP port 5060
; -----------------------------------------------------------------------------
[transport-udp]
type                    = transport
protocol                = udp
bind                    = 0.0.0.0:5060
; NAT: advertise the public IP so SDP/Contact use the right address.
external_media_address  = ${PUBLIC_IP}
external_signaling_address = ${PUBLIC_IP}
; Allow both RFC 3581 symmetric response (rport) and non-rport phones.
symmetric_transport     = yes

; -----------------------------------------------------------------------------
; TCP transport — SIP over TCP port 5060
; -----------------------------------------------------------------------------
[transport-tcp]
type                    = transport
protocol                = tcp
bind                    = 0.0.0.0:5060
external_media_address  = ${PUBLIC_IP}
external_signaling_address = ${PUBLIC_IP}
symmetric_transport     = yes

; -----------------------------------------------------------------------------
; TLS transport — encrypted SIP port 5061 (for SIPS URIs / TLS endpoints)
; -----------------------------------------------------------------------------
[transport-tls]
type                    = transport
protocol                = tls
bind                    = 0.0.0.0:5061
external_media_address  = ${PUBLIC_IP}
external_signaling_address = ${PUBLIC_IP}
; Self-signed cert generated by entrypoint.sh — replace with real cert in prod.
cert_file               = /etc/asterisk/keys/asterisk.crt
privkey_file            = /etc/asterisk/keys/asterisk.key
; Accept the self-signed cert from the other end (dev/testing only).
verify_server           = no
verify_client           = no
method                  = tlsv1_2
cipher                  = AES256-SHA:AES128-SHA
symmetric_transport     = yes

; -----------------------------------------------------------------------------
; WSS transport — WebSocket Secure (WebRTC browsers connect here on port 8089)
;
; Note: the actual TCP listen is done by the HTTP server in http.conf.
; This transport entry just tells PJSIP to handle WS/WSS connections that
; arrive on the HTTP server.  No "bind" needed here.
; -----------------------------------------------------------------------------
[transport-wss]
type                    = transport
protocol                = wss
; external addresses needed for SDP ice candidates
external_media_address  = ${PUBLIC_IP}
external_signaling_address = ${PUBLIC_IP}

; =============================================================================
; SEED ENDPOINT — 1001  (UDP softphone, e.g. Zoiper / Linphone / MicroSIP)
;
; Pattern used throughout:
;   [<id>] type=auth   — credentials
;   [<id>] type=aor    — address-of-record (registration target)
;   [<id>] type=endpoint — the actual SIP endpoint, ties auth+aor together
; =============================================================================

; --- Authentication ---
[auth-1001]
type            = auth
auth_type       = userpass
username        = 1001
; Password comes from env — in production each extension has its own secret.
; The api service writes per-extension auth records to the DB for realtime.
password        = ${ARI_PASSWORD}

; --- Address-of-Record ---
[aor-1001]
type            = aor
; Allow 5 simultaneous registrations (desk phone + softphone + mobile).
max_contacts    = 5
; Remove expired contacts automatically.
remove_existing = no
; Registration expiry hint.
default_expiration = 120
minimum_expiration = 60
maximum_expiration = 3600
; qualify=yes sends OPTIONS to keep the NAT hole open.
qualify_frequency = 30

; --- Endpoint ---
[1001]
type                    = endpoint
context                 = aipbx-internal
; Associate auth and aor sections.
auth                    = auth-1001
aors                    = aor-1001
; Caller ID shown to called party.
callerid                = "Extension 1001" <1001>
; Preferred transport for outbound to this endpoint.
transport               = transport-udp
; Codec negotiation — prefer ulaw, allow alaw and gsm as fallback.
allow                   = !all,ulaw,alaw,gsm
; NAT handling
rtp_symmetric           = yes
force_rport             = yes
rewrite_contact         = yes
direct_media            = no
; DTMF — RFC 2833 (RTP telephone-event), widely supported.
dtmf_mode               = rfc4733
; Voicemail extension (used by MWI notifications)
mailboxes               = 1001@default
; Subscribe to message-waiting indication
mwi_from_user           = 1001
; Enable basic presence for BLF on other phones
device_state_busy_at    = 1

; =============================================================================
; SEED ENDPOINT — 1002  (WebRTC browser phone, e.g. JsSIP / SIP.js / sipML5)
;
; webrtc=yes is a shorthand that sets the following automatically:
;   use_avpf=yes, media_encryption=dtls, dtls_verify=fingerprint,
;   dtls_setup=actpass, ice_support=yes, rtcp_mux=yes,
;   use_received_transport=yes, media_use_received_transport=yes.
; =============================================================================

; --- Authentication ---
[auth-1002]
type            = auth
auth_type       = userpass
username        = 1002
password        = ${ARI_PASSWORD}

; --- Address-of-Record ---
[aor-1002]
type            = aor
max_contacts    = 3
remove_existing = no
default_expiration = 120
minimum_expiration = 60
maximum_expiration = 3600
qualify_frequency  = 30

; --- Endpoint ---
[1002]
type                    = endpoint
context                 = aipbx-internal
auth                    = auth-1002
aors                    = aor-1002
callerid                = "Extension 1002" <1002>
; WebRTC MUST use the WSS transport.
transport               = transport-wss
; webrtc=yes configures DTLS-SRTP, ICE, AVPF, RTCP-mux automatically.
webrtc                  = yes
; Codecs: opus first (wideband / fullband, preferred by browsers),
; then ulaw as fallback for non-Opus clients.
allow                   = !all,opus,ulaw
; DTMF — WebRTC phones use in-band SIP INFO or RFC 2833.
dtmf_mode               = rfc4733
; DTLS certificate (same cert used by the HTTP/WSS server).
dtls_cert_file          = /etc/asterisk/keys/asterisk.crt
dtls_private_key        = /etc/asterisk/keys/asterisk.key
; Send BUNDLE offer (single RTP port for audio+video streams).
bundle                  = yes
; Voicemail / MWI
mailboxes               = 1002@default
mwi_from_user           = 1002
device_state_busy_at    = 1
; ACL (optional): restrict registration source
; acl                   = internal-acl
; Direct media bypass is NOT possible for WebRTC (media must flow through
; Asterisk so it can be recorded, monitored, etc.)
direct_media            = no

; =============================================================================
; TEMPLATE — anonymous inbound calls (from-trunk fallthrough)
;
; If a carrier sends INVITEs without matching a registered endpoint, this
; anonymous endpoint catches them and sends them to the from-trunk context.
; Comment out or restrict with ACL in production.
; =============================================================================
[anonymous]
type                    = endpoint
context                 = from-trunk
allow                   = !all,ulaw,alaw
direct_media            = no
rtp_symmetric           = yes
force_rport             = yes
rewrite_contact         = yes
dtmf_mode               = rfc4733

; =============================================================================
; TRUNK TEMPLATE — outbound/inbound SIP carrier registration
;
; Uncomment and fill in to add a carrier trunk.  The api service manages
; trunks dynamically by writing to the ps_* realtime tables in Postgres,
; but this template shows the static pattern.
;
; For each trunk you need:
;   1. A transport that sends from your public IP (transport-udp is fine)
;   2. An identify block so inbound INVITEs from the carrier match the trunk
;   3. auth, aor, endpoint sections
;   4. A registration section if the carrier requires REGISTER
; =============================================================================

; --- TRUNK: example-carrier (COMMENTED OUT — fill in and uncomment) ---

; [trunk-example-carrier-auth]
; type            = auth
; auth_type       = userpass
; username        = CARRIER_USERNAME
; password        = CARRIER_PASSWORD

; [trunk-example-carrier]
; type            = aor
; contact         = sip:sip.carrier.example.com:5060
; qualify_frequency = 60

; [trunk-example-carrier-endpoint]
; type                    = endpoint
; context                 = from-trunk
; outbound_auth           = trunk-example-carrier-auth
; aors                    = trunk-example-carrier
; transport               = transport-udp
; allow                   = !all,ulaw,alaw,g729
; from_user               = CARRIER_USERNAME
; from_domain             = sip.carrier.example.com
; direct_media            = no
; rtp_symmetric           = yes
; force_rport             = yes
; dtmf_mode               = rfc4733

; [trunk-example-carrier-registration]
; type                    = registration
; outbound_auth           = trunk-example-carrier-auth
; server_uri              = sip:sip.carrier.example.com
; client_uri              = sip:CARRIER_USERNAME@sip.carrier.example.com
; contact_user            = CARRIER_USERNAME
; retry_interval          = 60
; max_retries             = 10
; transport               = transport-udp

; [trunk-example-carrier-identify]
; type                    = identify
; endpoint                = trunk-example-carrier-endpoint
; match                   = sip.carrier.example.com

; =============================================================================
; ACL definitions (referenced by endpoint acl= option above)
; See also acl.conf for network-level ACLs.
; =============================================================================

; [internal-acl]
; type    = acl
; permit  = 0.0.0.0/0
; deny    = 0.0.0.0/0
; permit  = 10.0.0.0/8
; permit  = 172.16.0.0/12
; permit  = 192.168.0.0/16
