; =============================================================================
; acl.conf — Network Access Control Lists for AIpbx
;
; Named ACLs defined here can be referenced by name in other config files,
; e.g. in pjsip.conf endpoint sections:
;   acl = internal-only
;
; ACL evaluation order: deny entries are checked first, then permit entries.
; "deny all, then permit specific" is the recommended approach (allowlist).
;
; These ACLs are applied at the PJSIP / AMI / ARI layer.
; The docker-compose ports section and your firewall/DigitalOcean droplet
; firewall provide the outer perimeter.
; =============================================================================

; =============================================================================
; [internal-only] — Allow only RFC-1918 private address ranges
;
; Use on endpoints that should only register from inside the LAN / VPN.
; =============================================================================
[internal-only]
; Deny everything by default.
deny    = 0.0.0.0/0.0.0.0
; Permit RFC-1918 private ranges.
permit  = 10.0.0.0/255.0.0.0
permit  = 172.16.0.0/255.240.0.0
permit  = 192.168.0.0/255.255.0.0
; Permit loopback.
permit  = 127.0.0.1/255.255.255.255

; =============================================================================
; [docker-network] — Allow Docker bridge network ranges
;
; Use for services running in the same Docker Compose stack (api, ai-engine).
; Docker assigns bridge networks from 172.16.0.0/12 and 192.168.0.0/16.
; =============================================================================
[docker-network]
deny    = 0.0.0.0/0.0.0.0
permit  = 172.16.0.0/255.240.0.0
permit  = 10.0.0.0/255.0.0.0
permit  = 192.168.0.0/255.255.0.0
permit  = 127.0.0.1/255.255.255.255

; =============================================================================
; [allow-all] — Permissive ACL (no restrictions)
;
; Use during development or for publicly-accessible endpoints (with proper
; SIP authentication still required on the endpoint).
; =============================================================================
[allow-all]
permit  = 0.0.0.0/0.0.0.0

; =============================================================================
; [carrier-example] — ACL for a specific carrier IP range
;
; Replace with your actual carrier's IP ranges.  Most carriers publish
; their IP ranges in their documentation.
;
; Example — Twilio SIP signaling IPs (fictional, replace with real ones):
; =============================================================================
; [carrier-twilio]
; deny    = 0.0.0.0/0.0.0.0
; permit  = 54.172.60.0/255.255.255.0
; permit  = 54.244.51.0/255.255.255.0
; ; Add all carrier IP ranges here.
