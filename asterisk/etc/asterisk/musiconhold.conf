; =============================================================================
; musiconhold.conf — Music On Hold (MOH) classes for AIpbx
;
; MOH is played when:
;   - A caller is placed on hold by an agent
;   - A caller is waiting in a queue
;   - A caller is waiting in a ConfBridge room with no other participants
;
; The api service can switch MOH classes per-call via:
;   AMI   — Action: Hold / Unhold (with musicclass variable set)
;   ARI   — POST /channels/{id}/moh  (with mohClass parameter)
;
; Audio files should be placed in:
;   /var/lib/asterisk/moh/<class-name>/
; Supported formats: mp3, wav, gsm, ulaw, alaw, g722
;
; For production, upload custom on-hold music files to the container volume
; or bake them into the image.  Free-to-use MOH files are available from:
;   https://www.freeaudioclips.com/  (Creative Commons)
;   https://freemusicarchive.org/
; =============================================================================

[general]
; Default MOH class used when no class is specified.
; (This is the Asterisk built-in default — no change needed.)

; =============================================================================
; [default] — Default music on hold class
;
; Uses Asterisk's built-in sample MOH files if present, otherwise silence.
; The mode=files setting plays files from the directory in round-robin order.
; =============================================================================
[default]
mode            = files
directory       = /var/lib/asterisk/moh
; Sort order: alphabetical | random | random_next
sort            = random
; Loop files (start from beginning after last file).
loop_last       = no

; =============================================================================
; [ringback] — Ringback tone (used instead of MOH in some scenarios)
;
; Plays a ringback tone instead of music (useful for call transfers where
; the caller should hear ringing rather than music).
; =============================================================================
[ringback]
mode            = files
directory       = /var/lib/asterisk/mohmp3/ringback
sort            = alphabetical
; If the ringback directory doesn't exist, Asterisk falls back silently.

; =============================================================================
; [jazz] — Alternative jazz class (custom branding)
;
; Uncomment and populate /var/lib/asterisk/moh/jazz/ with audio files.
; =============================================================================
; [jazz]
; mode          = files
; directory     = /var/lib/asterisk/moh/jazz
; sort          = random

; =============================================================================
; [noise] — Comfort noise (PSTN hold behaviour)
;
; Some carriers expect silence or comfort noise rather than music.
; =============================================================================
[noise]
mode            = noise
; Play at reduced volume (0–100).

; =============================================================================
; [custom_stream] — Example HTTP streaming class
;
; If you have a streaming MOH source (internet radio, etc.), use mode=custom
; with an application that streams audio to stdout.
; =============================================================================
; [stream]
; mode          = custom
; application   = /usr/bin/mpg123 -s --stdout http://stream.example.com/moh
; format        = sln
