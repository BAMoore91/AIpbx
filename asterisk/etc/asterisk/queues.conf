; =============================================================================
; queues.conf — Call queue (ACD) configuration for AIpbx
;
; The api service manages queues dynamically via:
;   - AMI QueueAdd / QueueRemove / QueuePause / QueueStatus actions
;   - ARI bridges (for custom queue logic under Stasis control)
;   - Direct Postgres writes to res_config realtime tables (if realtime enabled)
;
; This file provides:
;   1. [general]  — global ACD settings
;   2. [default]  — a fallback queue (all calls land here if no other queue)
;   3. [support]  — sample support queue
;   4. [sales]    — sample sales queue
;
; Queue members (agents) are added dynamically by the api service; none are
; hardcoded here.  The api service calls QueueAdd/QueueRemove as agents
; log in/out via the React console or softphone.
; =============================================================================

[general]
; Persist dynamic members (added via AMI QueueAdd) to astdb so they survive
; an Asterisk reload.  "yes" = save to astdb; "dynamic" = dynamic only.
persistdynamic      = yes

; How long to wait between consecutive attempts to reach a queue member
; who didn't answer (agent call timeout retry interval).
; Default is 5 seconds.
retry               = 5

; Time between queue-position announcements to the caller.
; 0 = disable announcements.
announcefrequency   = 60

; Announce the estimated hold time.
annnounceholdtime   = once

; Announce caller's position in queue.
announceposition    = yes

; Minimum position at which to announce "your call is important to us."
minannouncefrequency = 15

; Allow callers to monitor their own queue position by pressing a DTMF digit.
; 0 = disabled.
; monitor-format      = wav

; Seconds of silence required before Asterisk considers the call ready for
; a next announcement (prevents cutting off music on hold).
timeoutrestart      = no

; -----------------------------------------------------------------------------
; [default] — catch-all queue
;
; Calls that fall through routing without a specific queue assignment land here.
; The api service should normally prevent this, but it's a useful safety net.
; -----------------------------------------------------------------------------
[default]
; Routing strategy.
; Options: ringall, leastrecent, fewestcalls, random, rrmemory, linear,
;          wrandom, rrordered
strategy            = ringall

; Maximum time a caller waits before being sent to the timeout extension.
; 0 = wait forever.
timeout             = 300

; How long to ring each agent before trying the next (ringall: this is the
; total ring time before failing).
; For leastrecent/fewestcalls this is per-agent ring time.
; 0 = use the default (15 seconds).
; Note: this is different from the overall queue timeout above.
wrapuptime          = 5

; How long an agent is paused after a completed call (wrap-up / ACW time).
; 0 = no auto-pause.

; Maximum number of callers allowed in queue.  0 = unlimited.
maxlen              = 0

; Allow callers to leave a voicemail instead of waiting.
; Dialplan: the queue timeout/exit sends to voicemail.
; (handled in extensions.conf, not here)

; Hold music class (defined in musiconhold.conf).
musicclass          = default

; Announce to the caller when an agent answers.
; announce            = queue-agent-will-answer

; Join announcement played to caller when they enter the queue.
; queue-youarenext, queue-callswaiting, queue-holdtime, queue-minutes,
; queue-seconds, queue-thankyou, queue-reporthold
; join-announcement   = queue-holdtime

; Periodic announcements while waiting.
; periodic-announce   = queue-periodic-announce
; periodic-announce-frequency = 60

; Caller ID name prefix while in queue (visible on agent's phone).
; setinterfacevar     = yes

; Allow callers to press 1 to opt out of the queue (escape key).
; escape-key          = 1

; Context to send the caller when they press the escape key.
; context             = aipbx-voicemail

; Context extension for timeout (handled by dialplan/api).

; -----------------------------------------------------------------------------
; [support] — Technical support queue
; -----------------------------------------------------------------------------
[support]
strategy            = leastrecent
; Ring each available agent for 20 seconds before trying the next.
timeout             = 600
wrapuptime          = 10
maxlen              = 50
musicclass          = default
; After 10 minutes in queue, set a custom variable the api service can read.
; (Implemented via ARI bridge manipulation, not native queue feature.)
; SLA threshold for reporting.
servicelevel        = 60

; Caller-ID manipulation — prefix agent's CID with queue name.
; (api service can do this via ARI before bridging)

; Ring agents in round-robin with memory (remembers last agent called).
; strategy = rrmemory

; Use ARI-controlled queue bridge instead of native queue app — the api service
; intercepts the StasisStart event and manages queue logic itself, providing
; real-time stats, priority routing, and skill-based routing.

; -----------------------------------------------------------------------------
; [sales] — Sales queue
; -----------------------------------------------------------------------------
[sales]
strategy            = ringall
timeout             = 300
wrapuptime          = 5
maxlen              = 20
musicclass          = default
servicelevel        = 30
; Announce position to caller immediately on join.
announceposition    = yes
announcefrequency   = 30
