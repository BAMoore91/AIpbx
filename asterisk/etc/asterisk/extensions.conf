; =============================================================================
; extensions.conf — AIpbx Dialplan
;
; Processed by envsubst in entrypoint.sh.
; Variables substituted: ${ARI_APP}
;
; IMPORTANT: Asterisk uses ${VARIABLE} for its own dialplan variables.
;            envsubst is called with an explicit variable list (only our env
;            vars), so Asterisk's own ${EXTEN}, ${CALLERID}, etc. are safe.
;
; =============================================================================
; Architecture overview
; ----------------------
;
; Inbound flow:
;   PSTN/carrier → from-trunk → aipbx-stasis → [Stasis app owns call]
;                                              → api service routes via ARI
;                                              → aipbx-ai (AudioSocket)
;                                              OR aipbx-internal (direct)
;                                              OR queue / IVR / voicemail
;
; Internal flow:
;   Extension → aipbx-internal → PJSIP/${EXTEN} → voicemail on no-answer
;
; Outbound flow:
;   aipbx-outbound → Dial(PJSIP/${number}@trunk)
;
; AI bridge flow (subroutine):
;   Any context → Gosub(aipbx-ai,s,1(${uuid}))
;   → AudioSocket(${uuid},ai-engine:9092)
;
; AudioSocket wire format (for reference):
;   Each frame = 1 byte type | 2 bytes big-endian length | <length> bytes payload
;     0x01 — UUID identification frame (sent by Asterisk at connection start)
;             payload: 16-byte UUID identifying this call session
;     0x10 — Audio frame
;             payload: 8 kHz, mono, signed 16-bit little-endian PCM samples
;     0x00 — Hangup / close
;             payload: empty (length = 0)
; =============================================================================

; =============================================================================
; [globals] — Dialplan-wide global variables
; =============================================================================
[globals]
; Name of the Stasis application (substituted by envsubst from ARI_APP env var).
; After envsubst this becomes e.g. STASIS_APP=aipbx
STASIS_APP=${ARI_APP}

; AudioSocket AI engine address and port.
AI_ENGINE_HOST=ai-engine
AI_ENGINE_PORT=9092

; Default voicemail extension (used as fallback when no mailbox configured).
DEFAULT_VM_EXTEN=s

; Recording format — WAV is universally supported.
; Change to "wav49" (GSM/WAV) to save ~4x disk space.
RECORDING_FORMAT=wav

; Ring timeout in seconds before sending to voicemail.
RING_TIMEOUT=25

; =============================================================================
; [aipbx-internal] — Internal extension-to-extension dialing
;
; Pattern _1XXX matches four-digit extensions starting with 1 (1000-1999).
; Extend the pattern (e.g. _[12]XXX) to accommodate more extension ranges.
; =============================================================================
[aipbx-internal]

; ---------------------------------------------------------------------------
; _1XXX — call an internal extension
; ---------------------------------------------------------------------------
exten => _1XXX,1,NoOp(Internal call: ${CALLERID(num)} → ${EXTEN})
 ; Start recording this call immediately (writes to /var/spool/asterisk/monitor)
 same  =>       n,MixMonitor(${UNIQUEID}-${EXTEN}-${STRFTIME(${EPOCH},,%Y%m%d%H%M%S)}.${RECORDING_FORMAT},ab)
 ; Dial the PJSIP endpoint with a ring timeout.
 ; b() pre-dial subroutine could be used for custom ring-back tones.
 same  =>       n,Dial(PJSIP/${EXTEN},${RING_TIMEOUT},tT)
 ; Handle the dial status after the call ends or times out.
 same  =>       n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy,1)
 same  =>       n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?noanswer,1)
 same  =>       n,GotoIf($["${DIALSTATUS}" = "CHANUNAVAIL"]?unavail,1)
 ; Call was answered and completed normally.
 same  =>       n,Hangup()

; --- BUSY ---
exten => busy,1,NoOp(Busy: ${EXTEN})
 same  =>      n,Playback(tt-allbusy)
 same  =>      n,VoiceMail(${EXTEN}@default,b)
 same  =>      n,Hangup()

; --- NO ANSWER → voicemail ---
exten => noanswer,1,NoOp(No answer: ${EXTEN})
 same  =>           n,Playback(vm-nobodyavail)
 same  =>           n,VoiceMail(${EXTEN}@default,u)
 same  =>           n,Hangup()

; --- CHANNEL UNAVAILABLE (endpoint not registered) ---
exten => unavail,1,NoOp(Unavailable: ${EXTEN})
 same  =>          n,Playback(pbx-invalid)
 same  =>          n,VoiceMail(${EXTEN}@default,u)
 same  =>          n,Hangup()

; --- Invalid extension ---
exten => i,1,NoOp(Invalid extension dialed: ${EXTEN})
 same  =>   n,Playback(pbx-invalid)
 same  =>   n,Hangup()

; --- Catch-all timeout ---
exten => t,1,Hangup()

; =============================================================================
; [aipbx-stasis] — Hand calls to the ARI Stasis application
;
; This is the primary inbound routing context.  Calls entering here are
; immediately handed to the Stasis() application, which suspends the dialplan
; and emits a StasisStart event to the api service over the ARI WebSocket.
;
; The api service then has full control: it can:
;   - Answer/reject the call
;   - Play audio / run TTS
;   - Bridge to an agent (AudioSocket to ai-engine)
;   - Add to a queue
;   - Transfer, record, etc.
;   - Continue the dialplan (via /channels/{id}/continue) to resume here
;     or redirect to another context
; =============================================================================
[aipbx-stasis]

; Main entry point — all DIDs/inbound calls route here.
exten => s,1,NoOp(Entering Stasis: channel=${CHANNEL(name)} DID=${EXTEN})
 ; Start call recording before entering Stasis so recording begins immediately.
 same  => n,MixMonitor(${UNIQUEID}-inbound-${STRFTIME(${EPOCH},,%Y%m%d%H%M%S)}.${RECORDING_FORMAT},ab)
 ; Hand control to the api service's Stasis application.
 ; The second argument is passed to the api service as a custom data string —
 ; use it to convey routing hints (e.g. DID, campaign ID).
 same  => n,Stasis(${STASIS_APP},inbound,${EXTEN})
 ; *** api service is now in control ***
 ; If the api service issues a /continue, execution resumes here:
 same  => n,NoOp(Stasis returned — continuing dialplan)
 same  => n,Hangup()

; DID pattern — specific DIDs can be mapped to Stasis with extra context.
; e.g. exten => _+1NXXNXXXXXX,1,Goto(aipbx-stasis,s,1)
exten => _X.,1,Goto(aipbx-stasis,s,1)

; =============================================================================
; [aipbx-ai] — AudioSocket bridge to the AI voice engine
;
; This context is implemented as a Gosub subroutine so it can be called from
; any other context or from the api service via /channels/continue.
;
; Call convention:
;   Gosub(aipbx-ai,s,1(${call_uuid}))
;
; ARG1 = call UUID (string, should be a UUID v4).
;         Asterisk sends this UUID in the first AudioSocket frame (type 0x01)
;         so the ai-engine can correlate the TCP connection to the ARI call.
;
; The AudioSocket() application:
;   AudioSocket(<uuid>,<host>:<port>)
;     - Establishes a TCP connection to <host>:<port>
;     - Sends the UUID frame (0x01, 16 bytes) immediately
;     - Then streams bi-directional 8 kHz mono s16le PCM at ~160 bytes/frame
;       (20 ms of audio per frame = 320 samples × 2 bytes)
;     - Returns when the TCP connection closes (ai-engine sends type 0x00)
;       or when the channel hangs up
;
; AudioSocket wire framing (documented here for the ai-engine developers):
;   Frame header:  [type:1][length:2 big-endian]
;   Frame body:    [payload: <length> bytes]
;
;   type 0x01 — UUID (sent once at connect, payload = 16-byte binary UUID)
;   type 0x10 — Audio (payload = PCM s16le 8kHz mono)
;   type 0x00 — Hangup (payload empty; close connection)
; =============================================================================
[aipbx-ai]

exten => s,1,NoOp(AI bridge subroutine: UUID=${ARG1})
 ; Prefer the AI_UUID channel variable set by the api service over ARI (it
 ; equals the call_uuid registered with ai-engine). Fall back to a Gosub ARG1,
 ; then the channel UNIQUEID, so this context also works if invoked directly.
 same  => n,Set(AI_UUID=${IF($[${LEN(${AI_UUID})} > 0]?${AI_UUID}:${IF($[${LEN(${ARG1})} > 0]?${ARG1}:${UNIQUEID})})})
 same  => n,NoOp(Connecting AudioSocket to ${GLOBAL(AI_ENGINE_HOST)}:${GLOBAL(AI_ENGINE_PORT)} UUID=${AI_UUID})
 ; Answer the channel if not already answered (AudioSocket requires active RTP).
 same  => n,Answer()
 ; Short delay to let RTP negotiation complete before streaming audio.
 same  => n,Wait(0.5)
 ; === AudioSocket bridge ===
 ; This call blocks until the ai-engine closes the TCP connection or the
 ; channel hangs up.  During this time, all audio flows to/from ai-engine.
 same  => n,AudioSocket(${AI_UUID},${GLOBAL(AI_ENGINE_HOST)}:${GLOBAL(AI_ENGINE_PORT)})
 ; AudioSocket returned — either ai-engine closed the session or caller hung up.
 same  => n,NoOp(AudioSocket returned: AUDIOSOCKET_STATUS=${AUDIOSOCKET_STATUS})
 ; Return to the caller (Gosub return).
 same  => n,Return()

; Error handling — if AudioSocket fails to connect.
exten => failed,1,NoOp(AudioSocket connection failed)
 same  =>         n,Playback(all-circuits-busy-now)
 same  =>         n,Return()

; =============================================================================
; [aipbx-outbound] — Outbound calling through SIP trunks
;
; Called by the api service via AMI Originate or by the dialplan directly.
; Expects:
;   ${OUTBOUND_TRUNK}  — AOR/endpoint name of the trunk (e.g. "trunk-twilio")
;   ${EXTEN}           — destination PSTN number (e.g. +12125551234)
;
; The api service sets these channel variables before originating.
; =============================================================================
[aipbx-outbound]

; Outbound to PSTN via trunk — called with Goto(aipbx-outbound,${number},1)
exten => _+1NXXNXXXXXX,1,NoOp(Outbound PSTN: ${EXTEN} via ${OUTBOUND_TRUNK})
 same  => n,Set(CALLERID(num)=${OUTBOUND_CID})
 same  => n,Set(CALLERID(name)=${OUTBOUND_CIDNAME})
 same  => n,MixMonitor(${UNIQUEID}-outbound-${STRFTIME(${EPOCH},,%Y%m%d%H%M%S)}.${RECORDING_FORMAT},ab)
 same  => n,Dial(PJSIP/${EXTEN}@${OUTBOUND_TRUNK},60,tTgH)
 same  => n,Hangup()

; International numbers (+NXX...)
exten => _+NXXXXXXXXX.,1,NoOp(Outbound international: ${EXTEN})
 same  => n,Set(CALLERID(num)=${OUTBOUND_CID})
 same  => n,MixMonitor(${UNIQUEID}-outbound-${STRFTIME(${EPOCH},,%Y%m%d%H%M%S)}.${RECORDING_FORMAT},ab)
 same  => n,Dial(PJSIP/${EXTEN}@${OUTBOUND_TRUNK},60,tTgH)
 same  => n,Hangup()

; 10-digit domestic (without leading +1) — normalize and route.
exten => _NXXNXXXXXX,1,NoOp(Outbound domestic 10-digit: ${EXTEN})
 same  => n,Set(OUTBOUND_E164=+1${EXTEN})
 same  => n,Goto(aipbx-outbound,+1${EXTEN},1)

; 11-digit domestic (1NXXNXXXXXX) — normalize.
exten => _1NXXNXXXXXX,1,Goto(aipbx-outbound,+${EXTEN},1)

; Error — no trunk set.
exten => i,1,NoOp(Invalid outbound number: ${EXTEN})
 same  =>   n,Playback(pbx-invalid)
 same  =>   n,Hangup()

; =============================================================================
; [from-trunk] — Inbound calls from SIP carriers
;
; Carriers send INVITE to the anonymous or trunk endpoint, which maps to this
; context.  We validate the DID and forward to Stasis for routing.
; =============================================================================
[from-trunk]

; Catch-all inbound DID — send everything to Stasis for api-service routing.
; The api service looks up the DID in Postgres to determine the routing rule
; (ring group, queue, IVR, AI agent, etc.)
exten => _+1NXXNXXXXXX,1,NoOp(Inbound trunk: DID=${EXTEN} FROM=${CALLERID(num)})
 same  => n,Set(INBOUND_DID=${EXTEN})
 same  => n,Goto(aipbx-stasis,s,1)

; International DIDs
exten => _+NXXXXXXXXX.,1,NoOp(Inbound international DID: ${EXTEN})
 same  => n,Set(INBOUND_DID=${EXTEN})
 same  => n,Goto(aipbx-stasis,s,1)

; Any other format — still send to Stasis.
exten => _X.,1,NoOp(Inbound unformatted DID: ${EXTEN})
 same  => n,Set(INBOUND_DID=${EXTEN})
 same  => n,Goto(aipbx-stasis,s,1)

; Default catch-all for carriers that don't send a DID in the RURI.
exten => s,1,NoOp(Inbound anonymous trunk call)
 same  => n,Goto(aipbx-stasis,s,1)

; =============================================================================
; [aipbx-voicemail] — Voicemail helpers / direct mailbox access
;
; Users can call *1001 etc. to check voicemail directly.
; These star-codes are typically sent from the aipbx-internal context.
; =============================================================================
[aipbx-voicemail]

; Direct voicemail check: dial *1 + extension (e.g. *11001 to check 1001's VM)
exten => _*1XXXX,1,NoOp(Voicemail check: mailbox ${EXTEN:2})
 same  =>         n,Answer()
 same  =>         n,VoiceMailMain(${EXTEN:2}@default)
 same  =>         n,Hangup()

; Shortcut: *97 → check own voicemail
exten => *97,1,NoOp(Voicemail check own mailbox: ${CALLERID(num)})
 same  =>     n,Answer()
 same  =>     n,VoiceMailMain(${CALLERID(num)}@default)
 same  =>     n,Hangup()

; =============================================================================
; [aipbx-features] — DTMF feature codes and internal star codes
;
; These supplement the Asterisk built-in features (features.conf).
; Include this context in aipbx-internal via include => aipbx-features
; =============================================================================
[aipbx-features]

; *97 — Voicemail
exten => *97,1,Goto(aipbx-voicemail,*97,1)

; *98 — Voicemail (another common code)
exten => *98,1,Goto(aipbx-voicemail,*97,1)

; *67 — Block caller ID for next call
exten => *67,1,NoOp(Anonymous call)
 same  =>     n,Set(CALLERID(num)=anonymous)
 same  =>     n,Set(CALLERID(name)=Anonymous)
 same  =>     n,Hangup()

; 700 — Echo test
exten => 700,1,Answer()
 same  =>     n,Playback(demo-echotest)
 same  =>     n,Echo()
 same  =>     n,Playback(demo-echodone)
 same  =>     n,Hangup()

; 710 — Playback Asterisk version
exten => 710,1,Answer()
 same  =>     n,Verbose(2,Version check dialed by ${CALLERID(num)})
 same  =>     n,Hangup()
