; =============================================================================
; cdr.conf — Call Detail Record (CDR) core settings
;
; CDR records are generated automatically at the end of each call.
; The api service consumes CDR data via:
;   1. AMI event "Cdr" (real-time, as each call ends)
;   2. CSV files in /var/spool/asterisk/cdr-csv/ (backup/import)
;   3. PostgreSQL via ODBC (res_config_odbc + cdr_odbc) — most robust option
;      for production (set up sorcery.conf + res_odbc.conf to enable)
;
; Fields in a CDR record:
;   accountcode, src, dst, dcontext, clid, channel, dstchannel,
;   lastapp, lastdata, start, answer, end, duration, billsec,
;   disposition, amaflags, uniqueid, userfield
; =============================================================================

[general]
; Enable CDR subsystem.
enable              = yes

; Write CDR even if a call was not answered.
unanswered          = yes

; Write CDR for calls that were congested/busy (not just answered calls).
congestion          = yes

; Batch mode: collect CDR records in memory and write in batches for
; performance.  Disable for real-time AMI event delivery.
batch               = no
size                = 100
time                = 300
scheduler           = yes
safeshutdown        = yes

; ---------------------------------------------------------------------------
; Log CDR records to the AMI event stream so the api service can persist
; them in Postgres without polling.
; (Handled by res_cdr — the AMI event is "Cdr" with all fields.)
; ---------------------------------------------------------------------------

; ---------------------------------------------------------------------------
; [mappings] — Custom CDR variable mappings
;
; Store extra per-call data (set by the dialplan or api service) in CDR.
; The api service can set channel variables via AMI SetVar or ARI variable
; endpoint, which are then captured in CDR userfield.
; ---------------------------------------------------------------------------
; [csv]
; usegmtime = no           ; Log in localtime (change to yes for UTC)
; loguniqueid = yes
; loguserfield = yes
; accountlogs = yes        ; Separate CSV per account code
