; =============================================================================
; ari.conf — Asterisk REST Interface (ARI) configuration
;
; ARI is the primary control channel between the Node/TypeScript api service
; and Asterisk.  The api service:
;   - Subscribes to the Stasis WebSocket event stream
;   - Issues REST commands to control channels, bridges, recordings, playbacks
;   - Runs the Stasis application "${ARI_APP}" (default "aipbx")
;
; Processed by envsubst in entrypoint.sh.
; Variables substituted: ${ARI_USERNAME}, ${ARI_PASSWORD}, ${ARI_APP}
; =============================================================================

[general]
; Enable the ARI interface.
enabled             = yes

; Allow CORS from any origin during development.
; In production, restrict to your domain: e.g. https://app.aipbx.example.com
; The api service on the same Docker network doesn't need CORS, but the web
; console may talk to ARI directly in dev mode.
allowed_origins     = *

; Pretty-print JSON responses (useful for development; disable in prod).
pretty              = no

; ---------------------------------------------------------------------------
; ARI user — the api service authenticates with these credentials.
;
; The api service reads ARI_USERNAME / ARI_PASSWORD from its own env vars
; and connects to http://asterisk:8088 with Basic auth.
;
; IMPORTANT: the section name must equal the username.
; ---------------------------------------------------------------------------
[${ARI_USERNAME}]
type                = user
; Plain-text password from env.  ARI also supports md5 — see docs.
password            = ${ARI_PASSWORD}
password_format     = plain

; read  — allows querying state (GET requests)
; write — allows issuing commands (POST/DELETE/PUT requests)
; websocket — allows WebSocket event stream subscription
read_only           = no

; ---------------------------------------------------------------------------
; Stasis application name
;
; This value must match the ARI_APP environment variable used by the api
; service when it connects to the /ari/events WebSocket.
;
; In extensions.conf the Stasis() application is called as:
;   Stasis(${ARI_APP})
; which — after envsubst — expands to e.g.:
;   Stasis(aipbx)
;
; When Asterisk enters a Stasis() call it emits a StasisStart event on the
; WebSocket and hands full control to the api service.  The dialplan is
; effectively suspended until the api service issues a /channels/{id}/continue
; or the call hangs up.
; ---------------------------------------------------------------------------
; (No explicit Stasis app section needed here — apps are registered by the
;  api service when it subscribes to the event WebSocket with app=aipbx)
