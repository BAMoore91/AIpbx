; =============================================================================
; res_odbc.conf — ODBC connection pool for Asterisk realtime
;
; Processed by envsubst in entrypoint.sh.  ${PG_USER} and ${PG_PASSWORD}
; are derived from DATABASE_URL and exported before envsubst runs.
;
; The DSN name "asterisk-pg" must match the [asterisk-pg] stanza in
; /etc/odbc.ini (installed at container startup from the staged template).
;
; This module (res_odbc.so) must be pre-loaded before res_config_odbc.so
; and before any realtime consumers (res_pjsip via sorcery).  See modules.conf.
; =============================================================================

[asterisk]
enabled         => yes
dsn             => asterisk-pg
username        => ${PG_USER}
password        => ${PG_PASSWORD}
; Open a connection at Asterisk startup so the first SIP REGISTER does not
; incur a TCP connect penalty to Postgres.
pre-connect     => yes
; Maximum simultaneous ODBC connections in the pool.
max_connections => 10
; How long (seconds) Asterisk waits for a free connection before giving up.
; connection_timeout => 10
; Sanitize — drop and re-open connections that have gone stale.
sanitysql       => select 1
; Retry interval (seconds) if the initial connect fails.
backoff_time    => 1
; Log a warning if a query takes longer than this many milliseconds.
; query_timeout  => 5000
