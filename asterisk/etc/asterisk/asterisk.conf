; =============================================================================
; asterisk.conf — Core Asterisk process configuration
;
; This file is processed by envsubst in entrypoint.sh before Asterisk starts.
; All ${VAR} references are substituted with live environment values.
; =============================================================================

[options]
; Run as root inside the container (no privilege-drop needed).
runuser = root
rungroup = root

; Verbosity / debug levels (override via CLI: "core set verbose 5")
verbose = 3
debug   = 0

; Don't fork — Docker manages the process lifecycle.
nofork  = yes

; Write a PID file so health checks can verify the process.
astpidfile = /var/run/asterisk/asterisk.pid

; --------
; Logging
; --------
; Full logging config is in logger.conf.  Set timestamps here as well.
; (Deprecated in newer Asterisk but harmless.)

[files]
; Asterisk directory layout inside the container.
; Most of these are Asterisk defaults; listed explicitly for clarity.
astetcdir       => /etc/asterisk
astmoddir       => /usr/lib/asterisk/modules
astvarlibdir    => /var/lib/asterisk
astdbdir        => /var/lib/asterisk
astkeydir       => /etc/asterisk/keys
astdatadir      => /var/lib/asterisk
astagidir       => /var/lib/asterisk/agi-bin
astspooldir     => /var/spool/asterisk
astrundir       => /var/run/asterisk
astlogdir       => /var/log/asterisk
