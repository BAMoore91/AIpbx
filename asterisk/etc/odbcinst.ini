# ODBC driver registration — installed to /etc/odbcinst.ini by entrypoint.sh
#
# The psqlodbcw.so path is the Debian/Ubuntu location for the
# odbc-postgresql package (x86_64 architecture).  If the image is built
# for a different arch, the driver path must be adjusted accordingly.
[PostgreSQL]
Description = PostgreSQL ODBC driver (Unicode)
Driver      = /usr/lib/x86_64-linux-gnu/odbc/psqlodbcw.so
Setup       = /usr/lib/x86_64-linux-gnu/odbc/psqlodbcw.so
FileUsage   = 1
