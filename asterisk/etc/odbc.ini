# ODBC DSN definitions — installed to /etc/odbc.ini by entrypoint.sh.
#
# ${PG_HOST}, ${PG_PORT}, and ${PG_DB} are substituted by envsubst
# in entrypoint.sh after DATABASE_URL has been parsed.
#
# The DSN name "asterisk-pg" is referenced by res_odbc.conf (dsn => asterisk-pg).
[asterisk-pg]
Description = AIpbx Postgres (realtime ps_* tables)
Driver      = PostgreSQL
Servername  = ${PG_HOST}
Port        = ${PG_PORT}
Database    = ${PG_DB}
# Tune for container networking — quick failure on transient issues.
ConnSettings =
ReadOnly    = No
