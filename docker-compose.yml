# ============================================================================
# AIpbx — full stack orchestration
# Bring up:  docker compose up -d --build
# ============================================================================
name: aipbx

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied in lexicographic order on a FRESH volume. Migrations are mounted
      # too (idempotent) so fresh installs match migrated existing DBs.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/asterisk_realtime.sql:/docker-entrypoint-initdb.d/02-asterisk-realtime.sql:ro
      - ./db/migrations/002_departments_rbac.sql:/docker-entrypoint-initdb.d/03-migration-002.sql:ro
      - ./db/migrations/003_integrity.sql:/docker-entrypoint-initdb.d/04-migration-003.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [aipbx]
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [aipbx]
    logging: *default-logging

  # --------------------------------------------------------------------------
  asterisk:
    build: ./asterisk
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Host networking is strongly recommended for SIP/RTP NAT in production
    # (set `network_mode: host` and drop the ports block). For local dev we
    # publish only the externally-reachable ports. ARI (8088) is internal-only
    # and reached by the api service over the `aipbx` bridge — never published.
    ports:
      - "5060:5060/udp"        # SIP UDP
      - "5061:5061/tcp"        # SIP TLS
      - "8089:8089/tcp"        # WebRTC WSS
      - "10000-10200:10000-10200/udp"  # RTP media
    environment:
      ARI_USERNAME: ${ARI_USERNAME}
      ARI_PASSWORD: ${ARI_PASSWORD}
      SEED_SIP_PASSWORD: ${SEED_SIP_PASSWORD:-}
      ARI_APP: ${ARI_APP}
      PUBLIC_IP: ${PUBLIC_IP}
      RTP_START: ${RTP_START}
      RTP_END: ${RTP_END}
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - asterisk_spool:/var/spool/asterisk
      - asterisk_keys:/etc/asterisk/keys
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show uptime' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [aipbx]
    logging: *default-logging

  # --------------------------------------------------------------------------
  api:
    build: ./services/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=${NODE_ENV}
      - API_PORT=${API_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - JWT_ACCESS_TTL=${JWT_ACCESS_TTL}
      - JWT_REFRESH_TTL=${JWT_REFRESH_TTL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ARI_URL=${ARI_URL}
      - ARI_USERNAME=${ARI_USERNAME}
      - ARI_PASSWORD=${ARI_PASSWORD}
      - ARI_APP=${ARI_APP}
      - ASTERISK_HOST=${ASTERISK_HOST}
      - AI_ENGINE_URL=http://ai-engine:${AI_ENGINE_PORT}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
    ports:
      - "${API_PORT}:${API_PORT}"
    networks: [aipbx]
    logging: *default-logging

  # --------------------------------------------------------------------------
  ai-engine:
    build: ./services/ai-engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - AI_ENGINE_PORT=${AI_ENGINE_PORT}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - AUDIOSOCKET_HOST=${AUDIOSOCKET_HOST}
      - AUDIOSOCKET_PORT=${AUDIOSOCKET_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_EFFORT=${LLM_EFFORT}
      - STT_PROVIDER=${STT_PROVIDER}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TTS_PROVIDER=${TTS_PROVIDER}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
      - AZURE_TTS_KEY=${AZURE_TTS_KEY}
      - AZURE_TTS_REGION=${AZURE_TTS_REGION}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
    # No published ports: the HTTP control API (8080) is reached by `api` and the
    # AudioSocket server (9092) by `asterisk`, both over the internal `aipbx`
    # bridge. Exposing them would let anyone trigger billed LLM calls / hijack calls.
    expose:
      - "${AI_ENGINE_PORT}"
      - "${AUDIOSOCKET_PORT}"
    networks: [aipbx]
    logging: *default-logging

  # --------------------------------------------------------------------------
  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
        VITE_SIP_WSS_URL: ${VITE_SIP_WSS_URL}
    restart: unless-stopped
    depends_on: [api]
    networks: [aipbx]
    logging: *default-logging

  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api, web, ai-engine]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks: [aipbx]
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  asterisk_spool:
  asterisk_keys:
  certbot_certs:
  certbot_www:

networks:
  aipbx:
    driver: bridge
